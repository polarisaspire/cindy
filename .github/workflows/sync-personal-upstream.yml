name: Sync personal Cindy from upstream

on:
  schedule:
    - cron: '23 20 * * *' # Daily 04:23 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'polarisaspire/cindy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The controller waits for complete CI, both packages and final publication.
    timeout-minutes: 330
    steps:
      - name: Checkout the maintained main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_SYNC_TOKEN || github.token }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify release synchronization regressions
        run: node --test scripts/__tests__/sync-personal-upstream.test.mjs
      - name: Synchronize official stable releases and publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.PERSONAL_SYNC_TOKEN != '' }}
        run: node scripts/sync-personal-upstream.mjs sync
      - name: Report incomplete synchronization
        if: failure() || cancelled()
        run: |
          echo '::error::Stable release synchronization did not finish. Inspect the summary and linked CI/package run. The previous published version remains available; do not create a replacement draft.'
